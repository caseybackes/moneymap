[package]
name = "family-finance-desktop"
version = "0.1.0"
description = "Local-first household finance desktop application"
authors = ["Casey Backes"]
edition = "2021"

[lib]
name = "family_finance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
keyring = "3.6"
rand = "0.9"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
