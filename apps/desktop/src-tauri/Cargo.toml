[package]
name = "money-map-desktop"
version = "0.1.0"
description = "Local-first household finance desktop application"
authors = ["Casey Backes"]
edition = "2021"

[features]
default = ["production"]
production = []
sandbox-dev = []
rehearsal = []

[lib]
name = "money_map_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "money-map-rehearsal"
path = "src/rehearsal_main.rs"
required-features = ["rehearsal"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["backup", "bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native-sync-persistent", "crypto-rust"] }
